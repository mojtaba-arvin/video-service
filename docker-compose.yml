version: '3.9'

services:
    video-streaming:
        build:
            context: ./.docker-compose/video-streaming
            dockerfile: Dockerfile
        image: video-streaming
        depends_on:
            workflow-db:
                condition: service_healthy
        expose:
            ## using exposed ports on the nginx reverse proxy
            - "9999" # same as GRPC_PORT on circus.ini
            - "5555" # same as FLOWER_PORT on circus.ini
        volumes:
            - ./video-streaming:/opt/workdir/video-streaming
            - ./tmp/downloaded_videos/:/tmp/downloaded_videos/
            - ./tmp/transcoded_videos/:/tmp/transcoded_videos/
        environment:
            ## ping
            - WAIT_FOR=redis:6379,rabbitmq:5672,minio0:9000

    workflow-db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: video_workflows
            POSTGRES_USER: video
            POSTGRES_PASSWORD: ${WORKFLOW_DB_PASSWORD:-replace-me}
        volumes:
            - workflow-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U video -d video_workflows"]
            interval: 5s
            timeout: 3s
            retries: 20

volumes:
    workflow-db-data:
