name: Engineering contract validation

on:
  pull_request:
  push:
    branches:
      - "develop"

permissions:
  contents: read

concurrency:
  group: engineering-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate engineering contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check contract structure
        shell: bash
        run: |
          set -euo pipefail
          file="docs/engineering/ENGINEERING_CONTRACT.md"
          test -s "$file"
          for heading in "## Change and Git discipline" "## Agent authority and separation of duties" "## Evidence and Definition of Done" "## CI and supply-chain security" "## Test strategy and security" "## Repository-specific engineering profile"; do
            grep -Fq "$heading" "$file"
          done
          echo "Engineering contract structure is valid."
