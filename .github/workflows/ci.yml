name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.classify.outputs.runtime }}
      docs: ${{ steps.classify.outputs.docs }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "Unable to determine a safe diff base; running all checks."
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
          if [[ ! -s "$RUNNER_TEMP/changed-paths" ]]; then
            echo "No changed paths were returned; running all checks defensively."
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runtime_changed=false
          docs_changed=false
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/*|README*|CHANGELOG*|CONTRIBUTING*|CODE_OF_CONDUCT*|SECURITY*|LICENSE*|AGENTS.md|.agents/skills/*|.github/agents/*|.github/copilot-instructions.md|.github/pull_request_template.md|.github/ISSUE_TEMPLATE/*)
                docs_changed=true
                ;;
              *)
                runtime_changed=true
                if [[ "$path" == *.md ]]; then
                  docs_changed=true
                fi
                ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"

          echo "runtime=$runtime_changed" >> "$GITHUB_OUTPUT"
          echo "docs=$docs_changed" >> "$GITHUB_OUTPUT"
          echo "Runtime checks required: $runtime_changed"
          echo "Documentation checks required: $docs_changed"

  documentation:
    name: Documentation links
    needs: [detect-changes]
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate changed Markdown links
        env:
          BASE_SHA: ${{ needs.detect-changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.detect-changes.outputs.head_sha }}
        shell: bash
        run: |
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null && \
             git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            python3 scripts/check_markdown_links.py --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            python3 scripts/check_markdown_links.py --all
          fi

  unit-tests:
    name: Legacy runtime regression (Python 3.9)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-test-py39.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-test-py39.txt

      - name: Validate environment template tracking rules
        run: |
          git ls-files --error-unmatch video-streaming/video_streaming/.env.example >/dev/null
          if git ls-files --error-unmatch video-streaming/video_streaming/.env.local >/dev/null 2>&1; then
            echo ".env.local must not be tracked" >&2
            exit 1
          fi
          if git check-ignore --quiet --no-index video-streaming/video_streaming/.env.example; then
            echo ".env.example must remain trackable" >&2
            exit 1
          fi
          git check-ignore --quiet --no-index video-streaming/video_streaming/.env
          git check-ignore --quiet --no-index video-streaming/video_streaming/.env.local

      - name: Prepare safe environment for settings imports
        run: cp video-streaming/video_streaming/.env.example video-streaming/video_streaming/.env

      - name: Generate gRPC Python modules
        run: |
          cd video-streaming/scripts
          sh generate_grpc_codes.sh

      - name: Run regression suite
        env:
          PYTHONPATH: video-streaming
        run: python -m unittest discover -s video-streaming/tests -v

  compatibility:
    name: Regression suite (Python 3.12)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test-py312.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-test-py312.txt

      - name: Prepare safe environment for settings imports
        run: cp video-streaming/video_streaming/.env.example video-streaming/video_streaming/.env

      - name: Generate gRPC Python modules
        run: |
          cd video-streaming/scripts
          sh generate_grpc_codes.sh

      - name: Run regression suite
        env:
          PYTHONPATH: video-streaming
        run: python -m unittest discover -s video-streaming/tests -v

  vod-e2e:
    name: gRPC → Celery → FFmpeg → storage (Python ${{ matrix.python-version }})
    needs: [detect-changes]
    # Full media/broker/process acceptance runs after merge on develop and on explicit integration dispatch.
    if: needs.detect-changes.outputs.runtime == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            requirements: requirements-integration-py39.txt
          - python-version: "3.12"
            requirements: requirements-test-py312.txt
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workflows
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workflows"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Ensure FFmpeg is available
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
          else
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi

      - name: Install isolated integration dependencies
        run: python -m pip install --disable-pip-version-check --requirement ${{ matrix.requirements }}

      - name: Run real FFmpeg thumbnail regression tests
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: video-streaming
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_thumbnail_rendering.py' \
            -v

      - name: Run synthetic HLS/DASH package harness
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: video-streaming
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_synthetic_vod_package_harness.py' \
            -v

      - name: Run supervised FFmpeg watermark integration test
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: video-streaming
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_watermark_supervised_rendering.py' \
            -v

      - name: Generate gRPC Python modules
        run: |
          cd video-streaming/scripts
          sh generate_grpc_codes.sh

      - name: Prepare safe environment for runtime logging tests
        run: cp video-streaming/video_streaming/.env.example video-streaming/video_streaming/.env

      - name: Run required durable VOD request adapter tests
        env:
          PYTHONPATH: video-streaming
          VIDEO_STREAMING_REQUIRE_GRPC_TESTS: "1"
        run: |
          python - <<'PY'
          import sys
          import unittest

          loader = unittest.TestLoader()
          suite = loader.discover(
              "video-streaming/tests",
              pattern="test_durable_vod_request_adapter.py",
          )
          if loader.errors:
              raise SystemExit(
                  "Required gRPC adapter test discovery failed:\\n"
                  + "\\n".join(loader.errors)
              )
          discovered = suite.countTestCases()
          if discovered < 1:
              raise SystemExit("Required gRPC adapter lane discovered zero tests")

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          skipped = len(result.skipped)
          print(
              "adapter tests: discovered={}, executed={}, skipped={}, "
              "failures={}, errors={}".format(
                  discovered, result.testsRun, skipped,
                  len(result.failures), len(result.errors)
              )
          )
          if (
              result.testsRun != discovered
              or skipped != 0
              or result.failures
              or result.errors
          ):
              raise SystemExit("Required gRPC adapter acceptance failed")
          PY

      - name: Run sensitive logging regression tests
        env:
          PYTHONPATH: video-streaming
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_sensitive_logging.py' \
            -v

      - name: Apply workflow database migrations
        env:
          PYTHONPATH: video-streaming
          WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workflows
        run: alembic -c video-streaming/alembic.ini upgrade head

      - name: Run durable workflow repository tests (Python 3.9)
        if: matrix.python-version == '3.9'
        env:
          PYTHONPATH: video-streaming
          WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workflows
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_workflow_repository.py' \
            -v

      - name: Run transactional outbox tests (Python 3.9)
        if: matrix.python-version == '3.9'
        env:
          PYTHONPATH: video-streaming
          WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workflows
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_workflow_outbox.py' \
            -v

      - name: Run full VOD integration test
        env:
          PYTHONPATH: video-streaming
          WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workflows
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_vod_pipeline_e2e.py' \
            -v

      - name: Run durable workflow Celery consumer tests
        env:
          PYTHONPATH: video-streaming
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_workflow_tasks.py' \
            -v

      - name: Run required real Redis/Celery durable recovery acceptance tests
        env:
          PYTHONPATH: video-streaming
          WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workflows
          WORKFLOW_TEST_BROKER_URL: redis://127.0.0.1:6379/5
          WORKFLOW_TEST_RESULT_BACKEND: redis://127.0.0.1:6379/6
          CELERY_BROKER_URL: redis://127.0.0.1:6379/5
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/6
        run: |
          python - <<'PY'
          import unittest

          loader = unittest.TestLoader()
          suite = loader.discover(
              "video-streaming/tests",
              pattern="test_workflow_redis_celery.py",
          )
          if loader.errors:
              raise SystemExit(
                  "Redis/Celery acceptance discovery failed:\\n"
                  + "\\n".join(loader.errors)
              )
          discovered = suite.countTestCases()
          if discovered < 5:
              raise SystemExit(
                  "Expected at least five broker-backed recovery tests; got {}".format(
                      discovered
                  )
              )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          skipped = len(result.skipped)
          print(
              "Redis/Celery tests: discovered={}, executed={}, skipped={}, "
              "failures={}, errors={}".format(
                  discovered, result.testsRun, skipped,
                  len(result.failures), len(result.errors)
              )
          )
          if (
              result.testsRun != discovered
              or skipped
              or result.failures
              or result.errors
          ):
              raise SystemExit("Required Redis/Celery recovery acceptance failed")
          PY

      - name: Run real OS-process worker kill/restart recovery test
        env:
          PYTHONPATH: video-streaming
          WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workflows
          WORKFLOW_TEST_BROKER_URL: redis://127.0.0.1:6379/5
          WORKFLOW_TEST_RESULT_BACKEND: redis://127.0.0.1:6379/6
          CELERY_BROKER_URL: redis://127.0.0.1:6379/5
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/6
        run: |
          # Keep this as a real, guarded Python file: multiprocessing spawn
          # cannot re-import a stdin/heredoc __main__ module.
          python video-streaming/scripts/run_required_unittest.py \
            video-streaming/tests \
            test_workflow_worker_process_recovery.py \
            1

      - name: Run durable S3 publication and webhook retry contract tests
        env:
          PYTHONPATH: video-streaming
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_workflow_publication_handlers.py' \
            -v

      - name: Run S3 artifact store and KMS envelope contract tests
        env:
          PYTHONPATH: video-streaming
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_workflow_artifact_store.py' \
            -v
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_secret_store.py' \
            -v

  durable-workflow-state:
    name: Durable workflow repository (PostgreSQL, Python 3.12)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workflows
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workflows"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-workflow.txt

      - name: Install workflow repository dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-workflow.txt

      - name: Apply database migrations
        env:
          PYTHONPATH: video-streaming
          WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workflows
        run: alembic -c video-streaming/alembic.ini upgrade head

      - name: Rehearse destructive migration guards on PostgreSQL
        env:
          PYTHONPATH: video-streaming
          WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workflows
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_migration_downgrade_postgres.py' \
            -v

      - name: Rehearse the full PostgreSQL migration chain on an isolated database
        env:
          PYTHONPATH: video-streaming
          WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workflows
        run: |
          python - <<'PY'
          import psycopg2
          from psycopg2 import sql

          database_name = "workflow_migration_rehearsal"
          connection = psycopg2.connect(
              host="localhost",
              port=5432,
              dbname="postgres",
              user="postgres",
              password="postgres",
          )
          connection.autocommit = True
          try:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT 1 FROM pg_database WHERE datname = %s",
                      (database_name,),
                  )
                  if cursor.fetchone():
                      raise SystemExit(
                          "Migration rehearsal database unexpectedly already exists"
                      )
                  cursor.execute(
                      sql.SQL("CREATE DATABASE {}").format(
                          sql.Identifier(database_name)
                      )
                  )
          finally:
              connection.close()
          PY
          export WORKFLOW_DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/workflow_migration_rehearsal
          alembic -c video-streaming/alembic.ini upgrade head
          alembic -c video-streaming/alembic.ini downgrade base
          python - <<'PY'
          import os
          import psycopg2
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["WORKFLOW_DATABASE_URL"])
          connection = psycopg2.connect(
              host=url.host,
              port=url.port,
              dbname=url.database,
              user=url.username,
              password=url.password,
          )
          try:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT to_regclass('public.workflow_jobs'), "
                      "to_regclass('public.workflow_outbox'), "
                      "to_regclass('public.playback_sessions')"
                  )
                  remaining = cursor.fetchone()
                  if any(remaining):
                      raise SystemExit(
                          "Downgrade to base left workflow tables behind: {!r}".format(
                              remaining
                          )
                      )
          finally:
              connection.close()
          PY
          alembic -c video-streaming/alembic.ini upgrade head
          python - <<'PY'
          import os
          import psycopg2
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["WORKFLOW_DATABASE_URL"])
          connection = psycopg2.connect(
              host=url.host,
              port=url.port,
              dbname=url.database,
              user=url.username,
              password=url.password,
          )
          try:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT version_num FROM alembic_version")
                  revisions = [row[0] for row in cursor.fetchall()]
                  if revisions != ["0015_asset_provenance"]:
                      raise SystemExit(
                          "Re-upgrade did not reach the expected head: {!r}".format(
                              revisions
                          )
                      )
          finally:
              connection.close()
          PY

      - name: Run durable workflow repository tests
        env:
          PYTHONPATH: video-streaming
          WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workflows
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_workflow_repository.py' \
            -v

      - name: Run transactional outbox tests
        env:
          PYTHONPATH: video-streaming
          WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workflows
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_workflow_outbox.py' \
            -v

      - name: Run atomic secret-envelope repository tests (PostgreSQL)
        env:
          PYTHONPATH: video-streaming
          WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workflows
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_job_secret_repository.py' \
            -v

      - name: Run durable executor and artifact handoff tests (PostgreSQL)
        env:
          PYTHONPATH: video-streaming
          WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workflows
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_workflow_executor.py' \
            -v
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_workflow_artifact_store.py' \
            -v
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_workflow_worker_identity.py' \
            -v

  container-runtime:
    name: Container runtime build (Python 3.12)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.runtime == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build the production runtime image with a persistent layer cache
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./.docker-compose/video-streaming
          load: true
          pull: true
          tags: video-service-runtime-ci
          cache-from: type=gha,scope=video-service-runtime
          cache-to: type=gha,scope=video-service-runtime,mode=max

      - name: Smoke-test runtime, native extensions and media tools
        run: |
          docker run --rm --entrypoint /bin/sh video-service-runtime-ci -ec '
            python --version
            python -c "import asgiref, boto3, celery, circus, cryptography, gevent, grpc, psutil, psycopg2, sqlalchemy, zmq"
            ffmpeg -version
            ffprobe -version
            circusd --version
          '

      - name: Import the mounted application under the production runtime
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/video-streaming:/opt/workdir/video-streaming" \
            --workdir /opt/workdir/video-streaming \
            --entrypoint /bin/sh video-service-runtime-ci -ec '
              cp video_streaming/.env.example video_streaming/.env
              trap "rm -f video_streaming/.env" EXIT
              cd scripts && sh generate_grpc_codes.sh
              cd ..
              PYTHONPATH=/opt/workdir/video-streaming python -c "from video_streaming.grpc.server import GrpcServer; from video_streaming.celery import celery_app; from video_streaming.workflows.repository import WorkflowRepository"
            '

  cgroup-v2-linux-acceptance:
    name: Linux cgroup v2 kernel acceptance (Python 3.12)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.runtime == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test-py312.txt

      - name: Install process-control test dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-test-py312.txt

      - name: Build atomic cgroup process launcher
        run: cc -O2 -Wall -Wextra -Werror .docker-compose/video-streaming/cgroup_exec.c -o /tmp/video-cgroup-exec

      - name: Exercise real CPU, memory, PID and descendant controls on cgroup v2
        env:
          ATTEMPT_CGROUP_V2_EXECUTABLE: /tmp/video-cgroup-exec
        run: |
          sudo --preserve-env=PATH,ATTEMPT_CGROUP_V2_EXECUTABLE env PYTHONPATH=video-streaming python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_cgroup_v2_linux_acceptance.py' \
            -v

  quality-gates:
    name: Quality gates
    if: always()
    needs:
      - detect-changes
      - documentation
      - unit-tests
      - compatibility
      - vod-e2e
      - durable-workflow-state
      - container-runtime
      - cgroup-v2-linux-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.detect-changes.result }}
      RUNTIME_CHANGED: ${{ needs.detect-changes.outputs.runtime }}
      DOCS_CHANGED: ${{ needs.detect-changes.outputs.docs }}
      DOCS_RESULT: ${{ needs.documentation.result }}
      IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
      PY39_RESULT: ${{ needs.unit-tests.result }}
      PY312_RESULT: ${{ needs.compatibility.result }}
      VOD_E2E_RESULT: ${{ needs.vod-e2e.result }}
      PG312_RESULT: ${{ needs.durable-workflow-state.result }}
      CONTAINER_RESULT: ${{ needs.container-runtime.result }}
      CGROUP_RESULT: ${{ needs.cgroup-v2-linux-acceptance.result }}
    steps:
      - name: Enforce the required check policy
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }

          [[ "$CHANGES_RESULT" == "success" ]] || fail "Change detection did not complete successfully."

          if [[ "$DOCS_CHANGED" == "true" ]]; then
            [[ "$DOCS_RESULT" == "success" ]] || fail "Documentation link validation did not pass."
          fi

          if [[ "$RUNTIME_CHANGED" == "true" ]]; then
            [[ "$PY39_RESULT" == "success" ]] || fail "Python 3.9 regression suite did not pass."
            [[ "$PY312_RESULT" == "success" ]] || fail "Python 3.12 regression suite did not pass."
            [[ "$PG312_RESULT" == "success" ]] || fail "PostgreSQL compatibility tests on Python 3.12 did not pass."

            # PRs receive fast deterministic/runtime/database gates. The complete
            # media, broker/process, container and kernel acceptance remains
            # mandatory on develop pushes and explicit integration dispatches.
            if [[ "$IS_PULL_REQUEST" != "true" ]]; then
              [[ "$VOD_E2E_RESULT" == "success" ]] || fail "VOD end-to-end integration did not pass."
              [[ "$CONTAINER_RESULT" == "success" ]] || fail "Python 3.12 production container build and smoke test did not pass."
              [[ "$CGROUP_RESULT" == "success" ]] || fail "Real Linux cgroup v2 kernel acceptance did not pass."
            fi
          fi

          echo "All required checks passed for the detected change set." >> "$GITHUB_STEP_SUMMARY"
