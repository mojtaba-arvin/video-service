name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python 3.9)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check "python-decouple==3.4"

      - name: Run regression tests
        env:
          PYTHONPATH: video-streaming
        run: python -m unittest discover -s video-streaming/tests -v
