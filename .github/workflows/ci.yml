name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python 3.9)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "python-decouple==3.4" "ffmpeg-python==0.2.0"

      - name: Validate environment template tracking rules
        run: |
          git ls-files --error-unmatch video-streaming/video_streaming/.env.example >/dev/null
          if git ls-files --error-unmatch video-streaming/video_streaming/.env.local >/dev/null 2>&1; then
            echo ".env.local must not be tracked" >&2
            exit 1
          fi
          if git check-ignore --quiet --no-index video-streaming/video_streaming/.env.example; then
            echo ".env.example must remain trackable" >&2
            exit 1
          fi
          git check-ignore --quiet --no-index video-streaming/video_streaming/.env
          git check-ignore --quiet --no-index video-streaming/video_streaming/.env.local

      - name: Run regression tests
        env:
          PYTHONPATH: video-streaming
        run: python -m unittest discover -s video-streaming/tests -v
