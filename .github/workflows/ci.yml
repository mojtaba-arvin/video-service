name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python 3.9)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-test-py39.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-test-py39.txt

      - name: Validate environment template tracking rules
        run: |
          git ls-files --error-unmatch video-streaming/video_streaming/.env.example >/dev/null
          if git ls-files --error-unmatch video-streaming/video_streaming/.env.local >/dev/null 2>&1; then
            echo ".env.local must not be tracked" >&2
            exit 1
          fi
          if git check-ignore --quiet --no-index video-streaming/video_streaming/.env.example; then
            echo ".env.example must remain trackable" >&2
            exit 1
          fi
          git check-ignore --quiet --no-index video-streaming/video_streaming/.env
          git check-ignore --quiet --no-index video-streaming/video_streaming/.env.local

      - name: Generate and validate synthetic VOD corpus
        run: |
          python video-streaming/tests/fixtures/synthetic-vod-v1/generate.py \
            --output-dir "$RUNNER_TEMP/synthetic-vod-v1"

      - name: Run regression tests
        env:
          PYTHONPATH: video-streaming
        run: python -m unittest discover -s video-streaming/tests -v

  compatibility:
    name: Regression suite (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test-py312.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-test-py312.txt

      - name: Generate and validate synthetic VOD corpus
        run: |
          python video-streaming/tests/fixtures/synthetic-vod-v1/generate.py \
            --output-dir "$RUNNER_TEMP/synthetic-vod-v1"

      - name: Run regression tests
        env:
          PYTHONPATH: video-streaming
        run: python -m unittest discover -s video-streaming/tests -v


  vod-e2e:
    name: gRPC → Celery → FFmpeg → storage (Python 3.9)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workflows
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workflows"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-integration-py39.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install isolated integration dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-integration-py39.txt

      - name: Generate gRPC Python modules
        run: |
          cd video-streaming/scripts
          sh generate_grpc_codes.sh

      - name: Prepare safe environment for runtime logging tests
        run: cp video-streaming/video_streaming/.env.example video-streaming/video_streaming/.env

      - name: Run sensitive logging regression tests
        env:
          PYTHONPATH: video-streaming
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_sensitive_logging.py' \
            -v

      - name: Apply workflow database migrations
        env:
          PYTHONPATH: video-streaming
          WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workflows
        run: alembic -c video-streaming/alembic.ini upgrade head

      - name: Run full VOD integration test
        env:
          PYTHONPATH: video-streaming
          WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workflows
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_vod_pipeline_e2e.py' \
            -v

  durable-workflow-state:
    name: Durable workflow repository (PostgreSQL, Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workflows
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workflows"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-workflow.txt

      - name: Install workflow repository dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-workflow.txt

      - name: Apply database migrations
        env:
          PYTHONPATH: video-streaming
          WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workflows
        run: alembic -c video-streaming/alembic.ini upgrade head

      - name: Run durable workflow repository tests
        env:
          PYTHONPATH: video-streaming
          WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workflows
        run: |
          python -m unittest discover \
            -s video-streaming/tests \
            -p 'test_workflow_repository.py' \
            -v

