version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      test-dependencies:
        patterns:
          - python-decouple
          - ffmpeg-python
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /.docker-compose/video-streaming
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      runtime-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /.docker-compose/video-streaming
    schedule:
      interval: monthly
      day: "1"
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
